<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>purpol</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./icons/hicon.png">
    <!-- Three.js -->
    <script async src="https://unpkg.com/es-module-shims/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="right">
        <img class="icon" src="./star.png" alt="star logo">
    </div>
    
    <!-- Main content container -->
    <main class="main-container">
        <h1>Hello World!</h1>
        
        <!-- Loading indicator -->
        <div class="loading-screen">
            <div class="loading-spinner"></div>
            <p>Loading MacBook...</p>
        </div>

        <!-- Three.js scene container -->
        <div id="scene-container"></div>

        <!-- Sticker palette -->
        <div class="sticker-palette">
            <div class="sticker" draggable="true">
                <img src="stickers/auk.svg" alt="Auk sticker" />
            </div>
            <div class="sticker" draggable="true">
                <img src="stickers/star.svg" alt="Star sticker" />
            </div>
            <div class="sticker" draggable="true">
                <img src="stickers/heart.svg" alt="Heart sticker" />
            </div>
            <!-- Add more stickers here -->
        </div>
    </main>

    <footer>
        <h2 class="pol">purpol</h2>
    </footer>

    <script type="module" src="scene.js"></script>
</body>
</html>
